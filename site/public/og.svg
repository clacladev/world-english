<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="World English — a simpler, more regular English">
  <rect width="1200" height="630" fill="#f6f5f1"/>
  <rect width="1200" height="12" fill="#c2410c"/>
  <g font-family="Fraunces, Georgia, 'Times New Roman', serif" fill="#353534">
    <text x="90" y="180" font-size="34" letter-spacing="3" fill="#c2410c" font-family="Inter, system-ui, sans-serif" font-weight="600">WORLD ENGLISH · WoE</text>
    <text x="86" y="300" font-size="96" font-weight="500">A simpler, more</text>
    <text x="86" y="404" font-size="96" font-weight="500">regular English.</text>
    <text x="90" y="500" font-size="34" fill="#73706d">World English</text>
    <text x="360" y="500" font-size="34" fill="#c2410c" font-family="ui-monospace, Menlo, monospace">→  WERLD ING-glish</text>
  </g>
  <text x="90" y="560" font-size="26" fill="#73706d" font-family="Inter, system-ui, sans-serif">A regular, predictable revision of English — easy to learn, still legible as English.</text>
</svg>